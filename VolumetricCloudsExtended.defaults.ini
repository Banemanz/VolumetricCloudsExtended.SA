; VolumetricCloudsExtended - restart the game after editing.
; Distances and heights are in GTA world units (roughly metres).
; The defaults are intended for older GPUs.

[Renderer]
; 2 = 3D cloud banks (recommended), 1 = clustered classic clouds, 0 = classic crossed clouds.
RenderMode=2
; Mode 2: 1 = nearby 3D clouds + distant canopy; full 3D distance expands above 85% of canopy height. 0 = canopy only.
HybridClouds=1
; Mode 2: 0 = economy (recommended); 1 = finer textures and more samples.
CumulusDetail=0

[Clouds]
; How much of the sky is covered (0-512; 0 disables all custom clouds). Classic modes use this as the group count.
TargetProcClouds=160
; How much more cloud cover appears in bad weather (1 = unchanged; 0 = none).
BadWeatherDensityMultiplier=1.4
; Bottom of the cloud layer above sea level.
MinSpawnZ=200
; Top of the cloud layer above sea level. Must be higher than the bottom.
MaxSpawnZ=650
; Size of cloud formations (1 = normal, 2 = twice as wide).
SizeScale=1
; How fast clouds drift with the game's wind (0 = stationary).
WindMoveScale=0.9
; Overall cloud thickness (0 = invisible, 1 = normal, 2 = thicker).
Opacity=1
; Change this number for a different repeatable cloud pattern.
Seed=17321

[Atmosphere]
; Mode 2: visibility of 3D clouds and distant layers, independent of the world.
CloudDrawDistance=8000
; Mode 2: replace very distant 3D clouds with baked cloud images (1 = recommended; 0 = full volume).
FarBillboards=1
; Minimum distance before the far billboard transition may start (at least 5000).
BillboardStartDistance=5000
; Also start no sooner than this fraction of CloudDrawDistance (0.8 = 80%).
BillboardStartRatio=0.8
; Mode 2: distance where clouds begin to blend into the sky.
CloudFogStart=1600
; Mode 2: distance where cloud colour fully blends into the sky. Set equal to CloudFogStart to disable colour fog.
CloudFogEnd=8000
; Mode 2: cloud shading strength (0 = flat, 1 = stronger shadows).
CumulusContrast=0.65
; Mode 2: cloud brightness at night (0 = black, 1 = normal, 2 = brighter).
CumulusNightLight=1

[ClassicModes]
; Only used with RenderMode=0 or 1 (or if procedural textures cannot load).
; Mode 1: number of overlapping puffs per group (1-8).
PuffsPerCloud=5
; Opt in to extra textures from particle.txd; configure the names below first.
UseAdditionalTextures=0
; Comma-separated extra texture names; missing ones are ignored.
CloudTextureNames=cloud2,cloud3,cloud4
